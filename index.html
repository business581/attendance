<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
    }
    h2 { margin-top: 0; text-align: center; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; color: #555; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .cam-btn-label {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      text-align: center;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    #preview {
      width: 100%;
      max-height: 250px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
      object-fit: contain;
      background: #000;
    }
    .gps-box {
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 6px;
    }
    .gps-info { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .gps-retry-btn {
      background-color: #17a2b8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .success { display: block !important; background: #d4edda; color: #155724; }
    .error { display: block !important; background: #f8d7da; color: #721c24; }
    .loading { display: block !important; background: #cce5ff; color: #004085; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Attendance Form</h2>

    <form id="attendanceForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="userName" required placeholder="Enter full name">
      </div>

      <div class="form-group">
        <label>Employee ID *</label>
        <input type="text" id="empCode" required placeholder="Enter employee ID">
      </div>

      <div class="form-group">
        <label>Take Live Selfie *</label>
        <label for="nativeCam" class="cam-btn-label" id="camLabel">📷 Take Selfie</label>
        <input type="file" id="nativeCam" accept="image/*" capture="user" style="display:none;" onchange="processSelfie(this)">
        <img id="preview" alt="Preview">
      </div>

      <div class="form-group">
        <label>Location Status *</label>
        <div class="gps-box">
          <div id="gpsStatus" class="gps-info">Requesting location...</div>
          <button type="button" class="gps-retry-btn" onclick="fetchLocation()">📍 Fetch Location</button>
        </div>
      </div>

      <input type="hidden" id="photoData">
      <input type="hidden" id="lat">
      <input type="hidden" id="lng">

      <button type="submit" id="subBtn">Submit Attendance</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMZROoPvhrdncspSwOzYLQnpSrTvZ6OEEdiKBvpL3X_rD9UNZiSnPgma3lClIaBLxt/exec";
    let photoCaptured = false;

    function processSelfie(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 600, 800);
            const base64 = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('photoData').value = base64;
            const preview = document.getElementById('preview');
            preview.src = base64;
            preview.style.display = 'block';
            photoCaptured = true;
            document.getElementById('camLabel').innerText = '🔄 Retake Photo';
          };
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function fetchLocation() {
      const gpsStatus = document.getElementById('gpsStatus');
      gpsStatus.style.color = '#004085';
      gpsStatus.innerText = 'Requesting GPS access...';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            document.getElementById('lat').value = pos.coords.latitude;
            document.getElementById('lng').value = pos.coords.longitude;
            gpsStatus.style.color = '#155724';
            gpsStatus.innerText = '✅ Location acquired (' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ')';
          },
          err => {
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            gpsStatus.style.color = '#721c24';
            gpsStatus.innerText = '❌ GPS Error: Enable location permission in browser.';
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        gpsStatus.innerText = '❌ Geolocation not supported.';
      }
    }

    window.onload = fetchLocation;

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const statusDiv = document.getElementById('status');

      if (!photoCaptured) {
        alert('Please capture a selfie.');
        return;
      }
      if (!document.getElementById('lat').value) {
        alert('Please fetch your location first.');
        return;
      }

      document.getElementById('subBtn').disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Submitting data...';

      const formData = {
        userName: document.getElementById('userName').value.trim(),
        empCode: document.getElementById('empCode').value.trim(),
        photo: document.getElementById('photoData').value,
        latitude: document.getElementById('lat').value,
        longitude: document.getElementById('lng').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = '✅ Attendance recorded successfully!';
        document.getElementById('attendanceForm').reset();
        document.getElementById('preview').style.display = 'none';
        document.getElementById('camLabel').innerText = '📷 Take Selfie';
        photoCaptured = false;
        document.getElementById('subBtn').disabled = false;
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error submitting form.';
        document.getElementById('subBtn').disabled = false;
      });
    });
  </script>
</body>
</html>
